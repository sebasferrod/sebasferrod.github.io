<svg width="300" height="300" style="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css">
      .text { font-family: Arial; font-size: 10px; }
      .rect { fill: white; stroke: black; stroke-width: 1; }
      .titulo { font-family: Arial; font-size: 10px; font-weight: bold; fill: black; }
      .codigo {font-family: Courier, "Lucida Console", monospace; font-size: 7px; font-wight: bold;}
    </style>
    <rect id="atributo" class="rect" x="0" y="0" width="40" height="20" rx="5" ry="5"/>
    <rect id="entidad" class="rect" x="0" y="0" width="50" height="20"/>
    <path id="triangulo"
      d="M10,0 L21,17 L0,17 Z" 
      stroke="black" 
      stroke-width="1" 
      fill="white"
    />

    <g id="der-especializacion">
      <title x="15" y="35">DER especializacion</title>
      <desc>Grafico de un DER con una especializacion.</desc>

      <!-- Fondo -->
      <rect x="0" y="1" width="200" height="198" fill="#ffeedd" stroke="#000" stroke-width="2"/>
      <!-- Titulo -->
      <text x="14" y="19" class="titulo">Especializacion</text>
      <g transform="translate(8, 28)">
        <!--<rect x="0" y="0" width="182" height="160" fill="white"/>-->
        <!-- Entidad empleado-->
        <g transform="translate(57, 25)">
          <use href="#entidad" x="0" y="0"/>
          <text x="3" y="13" class="text">empleado</text>
        </g>
        <!-- Atributos empleado -->
        <g transform="translate(137, 5)">
          <g transform="translate(0, 0)">
            <use href="#atributo" x="0" y="0"/>
            <text x="7" y="13" font-family="Arial" font-size="10">legajo</text>
          </g>
          <g transform="translate(0, 22)">
            <use href="#atributo" x="0" y="0"/>
            <text x="3" y="13" font-family="Arial" font-size="10">nombre</text>
          </g>
          <g transform="translate(0, 44)">
            <use href="#atributo" x="0" y="0"/>
            <text x="3" y="13" font-family="Arial" font-size="10">apellido</text>
          </g>
        </g>
        <!-- lineas empleado -->
        <line x1="107" y1="28" x2="137" y2="15" stroke="black" stroke-width="0.5"/>
        <line x1="107" y1="35" x2="137" y2="38" stroke="black" stroke-width="0.5"/>
        <line x1="107" y1="42" x2="137" y2="60" stroke="black" stroke-width="0.5"/>
        <!-- Subentidad fijo -->
        <g transform="translate(7, 95)">
          <use href="#entidad" x="0" y="0"/>
          <text x="18" y="13" class="text">fijo</text>
          <line x1="25" y1="20" x2="25" y2="40" stroke="black" stroke-width="0.5"/>
        </g>
        <!-- Atributo fijo -->
        <g transform="translate(5, 135)">
          <rect id="atributo" class="rect" x="0" y="0" width="55" height="20" rx="5" ry="5"/>
          <text x="3" y="13" class="text">antiguedad</text>
        </g>
        <!-- Subentidad temporal -->
        <g transform="translate(107, 95)">
          <use href="#entidad" x="0" y="0"/>
          <text x="5" y="13" class="text">temporal</text>
          <line x1="25" y1="20" x2="25" y2="40" stroke="black" stroke-width="0.5"/>
        </g>
        <!-- Atributo temporal -->
        <g transform="translate(92, 135)">
          <rect class="rect" x="0" y="0" width="81" height="20" rx="5" ry="5"/>
          <text x="3" y="13" class="text">periodo_contrato</text>
        </g>
        <!-- Bifurcacion -->
        <g transform="translate(73, 60)">
          <use href="#triangulo" x="0" y="0" transform="translate(80, 61) rotate()"/>
          <!--<text x="7" y="14" fill="red" class="text">d</text> -->
          <line x1="10" y1="0" x2="10" y2="-15" stroke="black" stroke-width="0.5"/>
          <line x1="21" y1="17" x2="50" y2="35" stroke="black" stroke-width="0.5"/>
          <line x1="0" y1="17" x2="-30" y2="35" stroke="black" stroke-width="0.5"/>
        </g>
      </g>
    </g>
  </defs>
  
  <use href="#der-especializacion" x="0" y="0"/>

  <!-- Equivalente en el modelo relacional->
  <g transform="translate(10, 215)">
    <text class="codigo" x="0" y="0">empleado(legajo, nombre, apellido, antiguedad, periodo_contrato,</text> 
    <text class="codigo" x="270" y="0" fill="red">tipo</text>
    <text class="codigo" x="290" y="0">)</text>
  </g> -->
  
  <!-- Puntero ->
  <rect x="125" y="75" width="2" height="2" fill="red"/>
  <rect x="50" y="50" width="2" height="2"/>-->
</svg>